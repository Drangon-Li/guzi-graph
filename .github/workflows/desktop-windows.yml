name: Windows desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "tooling/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/desktop-windows.yml"
  push:
    branches: [main, "codex/windows-desktop"]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "tooling/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - name: Enable Corepack
        run: corepack enable
      - name: Select Yarn 1.22.22
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile
      - name: Desktop typecheck
        run: yarn desktop:typecheck
      - name: Core and web typecheck
        run: yarn test:typecheck
      - name: Main and preload tests
        working-directory: apps/desktop
        run: yarn test:main
      - name: Packaging tests
        working-directory: apps/desktop
        run: yarn test:packaging
      - name: Full Vitest suite including desktop, export, host and render environment
        timeout-minutes: 15
        run: yarn test:app run --reporter=dot --maxWorkers=2 --minWorkers=1
      - name: Build desktop renderer
        run: yarn desktop:build
      - name: Package Windows x64 unpacked application
        working-directory: apps/desktop
        run: yarn electron-builder --win --x64 --dir --publish never
      - name: Packaged launch, save and reopen smoke
        timeout-minutes: 5
        run: yarn desktop:test:smoke --executable "apps/desktop/release/win-unpacked/Excalidraw-Guzi.exe"
      - name: Package Windows x64 NSIS installer
        working-directory: apps/desktop
        run: yarn electron-builder --win nsis --x64 --publish never
      - name: Upload Windows installer and unpacked application
        uses: actions/upload-artifact@v4
        with:
          name: Excalidraw-Guzi-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/win-unpacked/
          if-no-files-found: error
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-smoke
          path: output/playwright/desktop-smoke/
          if-no-files-found: ignore
